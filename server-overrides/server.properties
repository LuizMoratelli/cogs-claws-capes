#Cogs, Claws & Capes - seeded once by tools/build.py server; your later edits are kept.
motd=\u00a76Cogs, Claws \u00a7f& \u00a7cCapes
# Offline (non-paid) accounts allowed: TrueUUID verifies paid accounts, OfflineAuth makes offline ones /register + /login.
# Invite list stays on: add friends with tools/whitelist.py (see docs/HOSTING.md), then `whitelist reload`.
online-mode=false
white-list=true
enforce-whitelist=true
enable-rcon=false
enable-query=false
# Heroes and jetpacks fly - without this vanilla kicks them for "flying is not enabled".
allow-flight=true
difficulty=hard
gamemode=survival
pvp=true
max-players=10
server-port=25565
view-distance=10
simulation-distance=8
spawn-protection=0
level-name=world
level-type=minecraft\:normal
max-tick-time=-1
sync-chunk-writes=false
network-compression-threshold=256
enforce-secure-profile=false
